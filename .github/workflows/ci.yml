name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - working-directory: bridge
        run: npm ci
      - working-directory: bridge
        run: npm test
      - working-directory: bridge
        run: npm run check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the firmware LVGL baseline
        run: git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Test firmware UI with real LVGL
        run: |
          cmake -S firmware/tests -B firmware/build/host-tests -DLVGL_SOURCE_DIR="$RUNNER_TEMP/lvgl"
          cmake --build firmware/build/host-tests --parallel 2
          ctest --test-dir firmware/build/host-tests --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware
